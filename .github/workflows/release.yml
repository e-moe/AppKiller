name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FASM
        run: |
          Expand-Archive vendor\fasmw17332.zip -DestinationPath fasmw
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\fasmw"
          Add-Content -Path $env:GITHUB_ENV  -Value "INCLUDE=$PWD\fasmw\INCLUDE"

      - name: Build AppKiller.exe
        run: fasm AppKiller.asm AppKiller.exe

      - name: Package release archive
        run: |
          Compress-Archive -Path AppKiller.exe, GPL-LICENSE.txt, README.md `
                           -DestinationPath "AppKiller-$env:GITHUB_REF_NAME.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "AppKiller-$env:GITHUB_REF_NAME.zip" `
            --title "$env:GITHUB_REF_NAME" `
            --notes ""
